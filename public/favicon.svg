<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .light-only { display: block; }
    .dark-only  { display: none; }
    @media (prefers-color-scheme: dark) {
      .light-only { display: none; }
      .dark-only  { display: block; }
    }
  </style>
  <image class="light-only" width="96" height="96" href="data:image/png;base64,"/>
  <image class="dark-only"  width="96" height="96" href="data:image/png;base64,"/>
</svg>
